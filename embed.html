<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed test | El Niño 2026 evidence explorer</title>
  <style>
    body { margin: 0; font: 16px/1.6 "Noto Sans", Arial, sans-serif; background: #fff; color: #393939; }
    .page { max-width: 1280px; margin: 0 auto; padding: 48px 32px; }
    .note { margin: 0 0 24px; color: #747474; font-size: 14px; }
    /* Stand-in for a CGIAR.org grid cell: the cell owns the spacing. */
    .grid-cell { outline: 1px dashed #cdcdcd; }
  </style>
</head>
<body>
  <div class="page">
    <p class="note">Test page simulating a CGIAR.org grid cell (dashed outline). The explorer should sit flush against the outline with no padding of its own and grow to its full height.</p>
    <div class="grid-cell">

      <!-- El Niño 2026 evidence explorer: copy from here -->
      <iframe
        id="cgiar-elnino"
        src="./"
        title="El Niño 2026 evidence explorer"
        loading="lazy"
        style="display:block;width:100%;height:1400px;border:0;"
      ></iframe>
      <script>
        // Grows the iframe to fit its content so it never shows a second scrollbar.
        window.addEventListener('message', function (e) {
          var f = document.getElementById('cgiar-elnino');
          if (!f || e.source !== f.contentWindow) return;
          if (e.data && e.data.type === 'cgiar-elnino:height') f.style.height = e.data.height + 'px';
        });
      </script>
      <!-- copy to here -->

    </div>
  </div>
</body>
</html>
