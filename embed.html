<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed test | El Niño 2026 evidence explorer</title>
  <style>
    body { margin: 0; font: 16px/1.6 Arial, sans-serif; background: #fafafa; }
    .host { max-width: 1240px; margin: 0 auto; padding: 32px 20px; }
    .host > p { color: #747474; }
  </style>
</head>
<body>
  <div class="host">
    <p>Test page simulating a CGIAR.org page. Everything below the line is the embed code.</p>
    <hr>

    <!-- El Niño 2026 evidence explorer: copy from here -->
    <iframe
      id="cgiar-elnino"
      src="index.html"
      title="El Niño 2026 evidence explorer"
      loading="lazy"
      style="display:block;width:100%;height:1400px;border:0;"
    ></iframe>
    <script>
      // Grows the iframe to fit its content so it never shows a second scrollbar.
      window.addEventListener('message', function (e) {
        var f = document.getElementById('cgiar-elnino');
        if (!f || e.source !== f.contentWindow) return;
        if (e.data && e.data.type === 'cgiar-elnino:height') f.style.height = e.data.height + 'px';
      });
    </script>
    <!-- copy to here -->
  </div>
</body>
</html>
